<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15151A" media="(prefers-color-scheme: dark)">
<title>10+ · Nuova password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="testi.css?v=38">
</head>
<body>
<!-- Pagina per il genitore (issue #35): link creato dall'amministratore. Il token sta nel frammento (#t=...), che non
     arriva a nessun server; si verifica solo al tocco del pulsante, così le anteprime dei messaggi non lo consumano.
     Sessione solo in memoria; la pagina è fuori dalla cache del service worker. -->
<main class="admin">
  <h1><span class="a-logo">10<span>+</span></span> Nuova password</h1>
  <section id="np-modulo">
    <p>Scegli la password nuova per l'account genitore. Almeno 10 caratteri.</p>
    <label for="np-1">Nuova password</label><input id="np-1" type="password" autocomplete="new-password" minlength="10">
    <label for="np-2">Scrivila di nuovo</label><input id="np-2" type="password" autocomplete="new-password" minlength="10">
    <div class="riga"><button class="azione" id="np-salva" type="button">Imposta la nuova password</button></div>
  </section>
  <p id="np-msg" role="status" aria-live="polite"></p>
  <p id="np-fine" hidden><a href="./">Vai a 10+ ed entra con la password nuova</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
<script>
"use strict";
(function () {
  const SB_URL = "https://nnzkmjpylwtinplepxgz.supabase.co";
  const SB_KEY = "sb_publishable_WTCYzSgAc_rVk7r04sdT8w_VFUwzFHJ";
  const $ = (id) => document.getElementById(id);
  const msg = (t, e) => { $("np-msg").textContent = t; $("np-msg").className = e ? "errore" : ""; };
  const token = new URLSearchParams(location.hash.slice(1)).get("t");
  history.replaceState(null, "", location.pathname); // il token non resta nella barra né nella cronologia
  if (!token) { $("np-modulo").hidden = true; msg("Link non valido. Chiedi un link nuovo a chi gestisce 10+.", true); return; }
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  $("np-salva").onclick = async () => {
    const p1 = $("np-1").value, p2 = $("np-2").value;
    if (p1.length < 10) { msg("Servono almeno 10 caratteri.", true); return; }
    if (p1 !== p2) { msg("Le due password non coincidono.", true); return; }
    $("np-salva").disabled = true; msg("Un momento…");
    const { error: e1 } = await sb.auth.verifyOtp({ type: "recovery", token_hash: token });
    if (e1) { msg("Il link è scaduto o è già stato usato. Chiedi un link nuovo.", true); return; }
    const { error: e2 } = await sb.auth.updateUser({ password: p1 });
    // global: chiude anche le altre sessioni del genitore (il motivo tipico di un cambio password)
    await sb.auth.signOut({ scope: e2 ? "local" : "global" }).catch(() => {});
    $("np-1").value = ""; $("np-2").value = "";
    if (e2) { msg("Password non salvata: " + (/weak|short|pwned/i.test(e2.message) ? "è troppo facile, scegline un'altra." : "riprova con un link nuovo."), true); return; }
    $("np-modulo").hidden = true; $("np-fine").hidden = false;
    msg("Fatto: la password è cambiata.");
  };
})();
</script>
</body>
</html>
